name: .NET Build, Test & Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write          # needed by the test reporter to publish results
  pull-requests: write   # lets the reporter comment on PRs

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AzureSnapshotManager.sln

      - name: Build
        run: dotnet build AzureSnapshotManager.sln --no-restore --configuration Release

      - name: Test with coverage
        run: >
          dotnet test AzureSnapshotManager.sln
          --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults
          --collect:"XPlat Code Coverage"

      - name: Publish test results
        if: always()          # run even when tests fail, so you see what broke
        uses: dorny/test-reporter@v1
        with:
          name: .NET test results
          path: TestResults/**/*.trx
          reporter: dotnet-trx

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Check for vulnerable packages
        run: dotnet list AzureSnapshotManager.sln package --vulnerable --include-transitive
        continue-on-error: true
