name: .NET Build, Test & Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AzureSnapshotManager.sln

      - name: Build
        run: dotnet build AzureSnapshotManager.sln --no-restore --configuration Release

      - name: Test with coverage
        run: >
          dotnet test AzureSnapshotManager.sln
          --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults
          --collect:"XPlat Code Coverage"

      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          f=$(find TestResults -name coverage.cobertura.xml | head -n 1)
          if [ -z "$f" ]; then
            echo "No coverage file found" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          rate=$(grep -o 'line-rate="[^"]*"' "$f" | head -n 1 | cut -d'"' -f2)
          pct=$(awk "BEGIN {printf \"%.1f\", $rate*100}")
          echo "## Code coverage" >> $GITHUB_STEP_SUMMARY
          echo "Line coverage: **${pct}%**" >> $GITHUB_STEP_SUMMARY

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: .NET test results
          path: TestResults/**/*.trx
          reporter: dotnet-trx

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Check for vulnerable packages
        run: dotnet list AzureSnapshotManager.sln package --vulnerable --include-transitive
        continue-on-error: true
